<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eeede5">
  <meta name="description" content="薄霧城。穿过山林与庭院，走入一座会呼吸的古老日式山城。可滚动漫游、切换四季与自由观察的手绘风格三维场景。">
  <title>薄霧城 — 3D 漫游</title>
  <link rel="icon" href="./assets/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script>
</head>
<body>
  <main>
    <h1 class="sr-only">薄霧城 · 三维漫游</h1>
    <section id="walk" class="walk-section" aria-label="滚动探索薄霧城">
      <div class="walk-sticky">
        <div id="scene" role="img" aria-label="可漫游的薄霧城三维场景"></div>
        <div id="loading" class="loading"><span class="loading-dot"></span><span id="loading-text">山城正在晨雾中苏醒</span></div>
        <div class="season-control" role="group" aria-label="选择季节">
          <button data-season="spring" aria-label="春季" aria-pressed="false">春</button>
          <button data-season="summer" aria-label="夏季" aria-pressed="false">夏</button>
          <button data-season="autumn" aria-label="秋季" aria-pressed="true">秋</button>
          <button data-season="winter" aria-label="冬季" aria-pressed="false">冬</button>
        </div>
        <div class="view-controls">
          <div class="walk-bottom">
            <div class="location">
              <span class="location-count"><span id="location-number">01</span><span aria-hidden="true"> / </span><span id="location-total">14</span></span>
              <div class="location-copy"><div class="location-heading"><strong id="location-title">山路</strong><span id="location-en" lang="en">The approach</span></div><p id="location-caption">林间的第一眼，山城静立在风里。</p></div>
            </div>
            <button id="inspect" class="inspect-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/></svg><span>自由观察</span></button>
          </div>
          <div id="inspection-bar" class="inspection-bar" hidden><div><strong>自由观察</strong><p><span>拖动环视</span><span>滚轮 / 双指变焦</span></p></div><button id="return-walk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6-6 6 6 6m-6-6h16"/></svg>返回漫游</button></div>
          <nav id="chapter-dots" class="chapter-dots" aria-label="漫游地点"></nav>
          <div class="route-line" aria-hidden="true"><span id="route-progress"></span></div>
          <div class="scroll-cue" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v16m-5-5 5 5 5-5"/></svg>滚动继续漫游</div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">请启用 JavaScript，进入薄霧城的三维漫游。</div></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
